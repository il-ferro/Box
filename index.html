<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Box">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Il mio Box</title>
<style>
:root{
  --bg:#111214; --card:#1b1d21; --card2:#24272c; --line:#2f333a;
  --text:#f2f2f0; --muted:#9a9ea6; --acc:#ff7a1a; --acc-ink:#1a0d00;
  --ok:#3ecf8e; --warn:#ffb020; --bad:#ff5a5a;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom));min-height:100vh}
header{padding:14px 16px 6px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:28px;margin:0;letter-spacing:-.5px}
header .sub{color:var(--muted);font-size:13px}
main{padding:0 16px}
.view{display:none}.view.on{display:block}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:22px 4px 8px;font-weight:600}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.qty{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;text-align:right;min-width:64px}
.qty small{font-size:12px;color:var(--muted);font-weight:500}
.low .qty{color:var(--warn)}.zero .qty{color:var(--bad)}
.bar{height:6px;background:var(--card2);border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.low .bar i{background:var(--warn)}.zero .bar i{background:var(--bad)}
.barlbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:3px}
.steps{display:flex;gap:6px;margin-top:10px}
.steps button{flex:1}
.steps.four button{padding:10px 4px;font-size:15px}
button{font:inherit;border:0;border-radius:10px;padding:10px 12px;background:var(--card2);color:var(--text);font-weight:600;cursor:pointer}
button:active{transform:scale(.97)}
button.acc{background:var(--acc);color:var(--acc-ink)}
button.ghost{background:transparent;color:var(--acc);padding:6px 4px}
button.danger{background:transparent;color:var(--bad)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 14px;border-radius:20px;background:var(--card);color:var(--muted);font-size:14px;font-weight:600}
.chip.on{background:var(--text);color:var(--bg)}
.motochips .chip.on{background:var(--acc);color:var(--acc-ink)}
.motochips{margin:6px 0 2px}
input,select,textarea{font:inherit;width:100%;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}
.search{margin:6px 0 4px}
.empty{color:var(--muted);text-align:center;padding:28px 10px}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.done .check{background:var(--ok);border-color:var(--ok)}
.done .check::after{content:"✓";color:#06281a;font-weight:800;font-size:15px}
.done .name{text-decoration:line-through;color:var(--muted)}
.buyrow{display:flex;gap:8px;align-items:center;margin-top:10px}
.buyrow input{width:90px;flex:none;text-align:center;padding:10px 6px}
.buyrow span{color:var(--muted);font-size:14px}
.buyrow button{margin-left:auto}
.spec{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.spec:last-child{border:0}.spec span:first-child{color:var(--muted)}.spec span:last-child{text-align:right}
.big{font-size:40px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--acc);color:var(--acc-ink);font-size:32px;font-weight:400;box-shadow:0 6px 20px rgba(0,0,0,.45);padding:0;z-index:5}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(22,23,26,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;background:none;color:var(--muted);font-size:10.5px;font-weight:600;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--acc)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:11px;border-radius:9px;padding:1px 6px;min-width:18px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));z-index:11;transform:translateY(105%);transition:transform .25s ease}
.sheet.on{transform:none}.sheet-bg.on{display:block}
.grab{width:40px;height:5px;background:var(--line);border-radius:3px;margin:4px auto 10px}
.sheet h3{margin:4px 0 6px;font-size:20px}
.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1;padding:14px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:20px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;white-space:nowrap}
.toast.on{opacity:1}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.mt{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mt .due{font-weight:600;color:var(--ok)}.mt.low .due{color:var(--warn)}.mt.zero .due{color:var(--bad)}
.mt button{padding:8px 12px}
details.grp{border-bottom:1px solid var(--line)}
details.grp summary{list-style:none;padding:10px 0;display:flex;justify-content:space-between;gap:10px;cursor:pointer}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary b{font-weight:600}
details.grp summary span{color:var(--muted);font-size:13px;text-align:right}
details.grp summary::after{content:"›";color:var(--muted);transition:transform .2s}
details.grp[open] summary::after{transform:rotate(90deg)}
.lg{display:flex;justify-content:space-between;padding:7px 0 7px 12px;font-size:14px;color:var(--muted);border-top:1px dashed var(--line)}
.mixadd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.mixadd button{padding:12px 4px}
.cond{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--muted);margin-left:6px;vertical-align:2px}
.offline{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
</style>
</head>
<body>
<header>
  <div><h1 id="title">Magazzino</h1><div class="sub" id="subtitle"></div></div>
  <div class="offline"><span class="dot" id="dot"></span><span id="net">offline ok</span></div>
</header>

<main>
  <!-- MAGAZZINO -->
  <section class="view on" id="v-stock">
    <input class="search" id="q" placeholder="Cerca pezzo, codice, scaffale…" autocomplete="off">
    <div class="chips motochips" id="motoF"></div>
    <div class="chips" id="cats"></div>
    <div id="stock"></div>
  </section>

  <!-- SPESA -->
  <section class="view" id="v-shop">
    <div class="chips motochips" id="motoF2"></div>
    <div id="shop"></div>
  </section>

  <!-- PARTI VECCHIE -->
  <section class="view" id="v-old">
    <input class="search" id="qo" placeholder="Cerca parte, moto, posto…" autocomplete="off">
    <div class="chips" id="oldModes"></div>
    <div id="old"></div>
  </section>

  <!-- MOTO -->
  <section class="view" id="v-moto">
    <button class="acc" id="addMoto" style="width:100%;padding:14px;margin:6px 0 12px">+ Aggiungi moto</button>
    <div id="moto"></div>
  </section>

  <!-- MISCELA -->
  <section class="view" id="v-mix">
    <div class="card">
      <label style="margin-top:0">Benzina (litri)</label>
      <input id="mixL" type="number" inputmode="decimal" step="0.1" min="0">
      <div class="mixadd" id="mixAdd"></div>
      <button id="mixZero" style="width:100%;margin-top:8px">Azzera</button>
      <label>Rapporto</label>
      <div class="chips" id="mixRatio"></div>
      <div style="text-align:center;margin:22px 0 4px">
        <div class="meta">Olio 2T da aggiungere</div>
        <div class="big" id="mixOut">0 ml</div>
      </div>
      <button class="acc" style="width:100%;padding:14px;margin-top:10px" id="mixUse">Fatto, scala dal magazzino</button>
      <div class="note" id="mixNote"></div>
    </div>
    <h2>Backup</h2>
    <div class="card">
      <div class="meta" style="margin:0 0 12px">I dati stanno solo su questo iPhone. Esporta un backup ogni tanto e salvalo in iCloud Drive.</div>
      <div class="grid2">
        <button id="exp">Esporta backup</button>
        <button id="imp">Importa backup</button>
      </div>
      <input type="file" id="impFile" accept=".json,application/json" hidden>
      <div class="note" id="lastBackup"></div>
    </div>
  </section>
</main>

<button class="fab" id="fab" aria-label="Aggiungi">+</button>

<nav>
  <button data-v="stock" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-6 9 6v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M7 21v-8h10v8"/><path d="M7 17h10"/></svg>Magazzino</button>
  <button data-v="shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h9.6a1 1 0 0 0 1-.8L21 7H6"/></svg>Spesa<span class="badge" id="shopBadge" hidden></span></button>
  <button data-v="old"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>Vecchie</button>
  <button data-v="moto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="17" r="3"/><circle cx="19" cy="17" r="3"/><path d="M5 17l4-7h5l3 7"/><path d="M14 10l-2-4h-2"/><path d="M16 6h3l-2 4"/></svg>Moto<span class="badge" id="motoBadge" hidden></span></button>
  <button data-v="mix"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5s6 6.6 6 11a6 6 0 0 1-12 0c0-4.4 6-11 6-11z"/><path d="M9 15a3 3 0 0 0 3 3"/></svg>Miscela</button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Dati ---------- */
const KEY = 'box-garage-v1';
const uid = () => Math.random().toString(36).slice(2, 10);
const CATS = [
  {id:'olio', label:'Olio e liquidi'},
  {id:'motore', label:'Motore'},
  {id:'guarnizioni', label:'Guarnizioni'},
  {id:'candele', label:'Candele'},
  {id:'freni', label:'Freni'},
  {id:'trasmissione', label:'Trasmissione'},
  {id:'plastiche', label:'Plastiche'},
  {id:'accessori', label:'Accessori'},
  {id:'scarichi', label:'Scarichi'},
  {id:'altro', label:'Altro'}
];
const PCATS = CATS.filter(c => c.id !== 'olio');
const catLabel = id => (CATS.find(c => c.id === id) || {label:'Altro'}).label;
/* Indovina la categoria dai vecchi dati */
function guessCat(name, unit){
  const n = String(name).toLowerCase();
  if (unit === 'L' || /olio|liquido|dot ?4|refrigerante/.test(n)) return 'olio';
  if (/candel/.test(n)) return 'candele';
  if (/guarniz|paraolio|o-?ring/.test(n)) return 'guarnizioni';
  if (/fren|pastigl|disco|pinza/.test(n)) return 'freni';
  if (/caten|corona|pignon|frizion|cambio/.test(n)) return 'trasmissione';
  if (/scaric|marmit|silenzi|espansion/.test(n)) return 'scarichi';
  if (/plastic|parafang|fianchett|tabella|convogliator/.test(n)) return 'plastiche';
  if (/piston|fasc|biell|cilindr|filtro|testa|valvol|carbur|iniett/.test(n)) return 'motore';
  if (/manopol|leve|paramani|adesiv|grafic|sella/.test(n)) return 'accessori';
  return 'altro';
}
const CONDS = ['Buono', 'Usurato', 'Da riparare', 'Rotto', 'Da vendere'];

function seed(){
  const it = (name, cat, unit, qty, min, buy, barMax, extra = {}) =>
    ({id:uid(), name, cat, unit, qty, min, buy, barMax, model:'SX 125', yFrom:'', yTo:'', loc:'', code:'', note:'', ...extra});
  return {
    v:3,
    motos:[{
      id:uid(), brand:'KTM', model:'SX 125', year:'2025', note:'Allestimento supermoto', hours:0,
      specs:[
        ['Miscela','Olio 2T sintetico JASO FD · 1:40'],
        ['Olio cambio','15W-50 JASO MA2 · 0,8 L'],
        ['Liquido raffreddamento','circa 1,2 L'],
        ['Frizione idraulica','Brembo · olio minerale'],
        ['Freni','DOT 4'],
        ['Forcella WP XACT','olio SAE 4'],
        ['Mono WP XACT','olio SAE 2.5']
      ],
      log:[]
    }],
    items:[
      it('Olio miscela 2T sintetico', 'olio', 'L', 1, 1, 1, 10, {model:'', note:'JASO FD', use:'mix'}),
      it('Olio cambio 15W-50', 'olio', 'L', 1, 0.8, 1, 2, {model:'', note:'JASO MA2 · cambio = 0,8 L'}),
      it('Liquido refrigerante', 'olio', 'L', 1, 1, 1, 2, {model:''}),
      it('Liquido freni DOT 4', 'olio', 'L', 0.25, 0.25, 0.5, 1, {model:''}),
      it('Olio frizione minerale', 'olio', 'L', 0.1, 0.1, 0.25, 0.5, {model:'', note:'Per frizione Brembo'}),
      it('Olio forcella SAE 4', 'olio', 'L', 0, 0, 1, 2, {model:''}),
      it('Candela', 'candele', 'pz', 1, 1, 1, 0, {note:'Controlla il codice sul manuale'}),
      it('Kit pistone', 'motore', 'pz', 0, 1, 1, 0, {yFrom:'2023', yTo:'2025'}),
      it('Filtro aria', 'motore', 'pz', 1, 1, 1, 0),
      it('Olio filtro aria', 'olio', 'pz', 1, 1, 1, 0, {model:''}),
      it('Lubrificante catena', 'trasmissione', 'pz', 1, 1, 1, 0, {model:''})
    ],
    old:[], shop:[], orders:[], mixRatio:40, mixL:0, lastBackup:null, smode:'cat', omode:'cat'
  };
}

/* Tabella manutenzione di partenza (modificabile) */
function defaultMaint(m){
  if (!/ktm/i.test(m.brand) || !/125/.test(m.model)) return [];
  const oil = re => (S.items.find(i => i.unit === 'L' && re.test(i.name)) || {}).id || '';
  const h = +m.hours || 0;
  return [
    {id:uid(), what:'Cambio olio cambio', every:15, lastH:h, oil:oil(/15w|cambio/i), liters:0.8},
    {id:uid(), what:'Pistone', every:15, lastH:h, oil:'', liters:0},
    {id:uid(), what:'Pulizia filtro aria', every:5, lastH:h, oil:'', liters:0},
    {id:uid(), what:'Olio forcella', every:45, lastH:h, oil:oil(/forcella/i), liters:0},
    {id:uid(), what:'Liquido freni', every:0, lastH:h, oil:oil(/freni|dot/i), liters:0}
  ];
}

let S;
function load(){
  try { const raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : seed(); }
  catch(e){ S = seed(); }
  migrate();
}
/* Converte i dati delle versioni precedenti senza perdere niente */
function migrate(){
  S.shop ||= []; S.motos ||= []; S.items ||= []; S.old ||= []; S.orders ||= [];
  S.smode ||= 'cat'; S.omode ||= 'cat';
  if (S.mixL == null) S.mixL = 0;
  S.motos.forEach(m => {
    if (m.model == null){
      const r = /^(\S+)\s*(.*?)\s*(?:\((\d{4})\))?\s*$/.exec(m.name || '') || [];
      m.brand = r[1] || m.name || ''; m.model = r[2] || ''; m.year = r[3] || '';
      delete m.name;
    }
    m.log ||= []; m.specs ||= [];
    m.log.forEach(l => { l.id ||= uid(); });
    if (!m.maint) m.maint = defaultMaint(m);
  });
  S.items.forEach(it => {
    if (it.buy == null) it.buy = 1;
    if ('moto' in it){
      const m = S.motos.find(x => x.id === it.moto);
      it.model = m ? m.model : ''; it.yFrom = m ? (m.year || '') : ''; it.yTo = it.yFrom;
      delete it.moto;
    }
    it.model ??= ''; it.yFrom ??= ''; it.yTo ??= '';
    if (it.barMax == null) it.barMax = it.unit === 'L' ? Math.max(1, Math.ceil(Math.max(+it.qty || 0, (+it.min || 0) * 2))) : 0;
    delete it.step;
    if (!CATS.some(c => c.id === it.cat)) it.cat = guessCat(it.name, it.unit);
    if (it.cat === 'olio'){ it.model = ''; it.yFrom = ''; it.yTo = ''; }
  });
  S.old.forEach(p => {
    if (!p.cat || !PCATS.some(c => c.id === p.cat)) p.cat = guessCat(p.name, '') === 'olio' ? 'altro' : guessCat(p.name, '');
    if (p.motoId === undefined){
      const m = S.motos.find(x => norm(motoName(x)) === norm(p.from) || (p.from && norm(motoName(x)).includes(norm(p.from))));
      p.motoId = m ? m.id : '';
      if (m) p.from = '';
    }
  });
  if (!S.mf || (S.mf !== 'tutte' && !S.motos.some(m => m.id === S.mf))) S.mf = 'tutte';
  S.v = 3;
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('Impossibile salvare!'); }
  renderBadge();
}
load();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}

/* ---------- Utili ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = n => Math.round((+n || 0) * 100) / 100;
const fmtN = n => r2(n).toLocaleString('it-IT', {maximumFractionDigits:2});
const fmt = (n, u) => fmtN(n) + (u === 'L' ? ' L' : ' pz');
const fmtH = h => (Math.round(h * 10) / 10).toLocaleString('it-IT') + ' h';
const num = sel => { const v = parseFloat(String($(sel).value).replace(',', '.')); return isNaN(v) ? null : v; };
function motoName(m){ return [m.brand, m.model].filter(Boolean).join(' ') + (m.year ? ` (${m.year})` : ''); }
const isLow = it => +it.min > 0 && +it.qty < +it.min;
function norm(s){ return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
let tT; function toast(t){ const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(tT); tT = setTimeout(() => e.classList.remove('on'), 1800); }

/* Compatibilità: un pezzo senza modello va bene per tutte le moto */
function fits(it, m){
  if (!m) return true;
  if (it.cat === 'olio' || !it.model) return true;
  if (!norm(m.brand + m.model).includes(norm(it.model))) return false;
  const y = +m.year; if (!y) return true;
  return (!it.yFrom || y >= +it.yFrom) && (!it.yTo || y <= +it.yTo);
}
const curMoto = () => S.motos.find(m => m.id === S.mf);
const motoMatch = it => S.mf === 'tutte' || fits(it, curMoto());
function compat(it){
  if (it.cat === 'olio') return 'Universale';
  if (!it.model) return '';
  const y = it.yFrom && it.yTo ? (it.yFrom === it.yTo ? it.yFrom : `${it.yFrom}–${it.yTo}`) : it.yFrom ? `dal ${it.yFrom}` : it.yTo ? `fino al ${it.yTo}` : '';
  return it.model + (y ? ' ' + y : '');
}
function renderMotoFilter(el, after){
  if (!S.motos.length){ el.innerHTML = ''; return; }
  const all = [{id:'tutte', label:'Tutte le moto'}, ...S.motos.map(m => ({id:m.id, label:motoName(m)}))];
  el.innerHTML = all.map(m => `<button class="chip ${S.mf===m.id?'on':''}" data-m="${m.id}">${esc(m.label)}</button>`).join('');
  el.querySelectorAll('.chip').forEach(b => b.onclick = () => { S.mf = b.dataset.m; save(); after(); });
}
const modelList = () => `<datalist id="models">${[...new Set(S.motos.map(m => m.model).filter(Boolean))].map(x => `<option>${esc(x)}</option>`).join('')}</datalist>`;

/* ---------- Navigazione ---------- */
let view = 'stock';
const titles = {stock:'Magazzino', shop:'Da comprare', old:'Parti vecchie', moto:'Le mie moto', mix:'Miscela'};
document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.v));
function go(v){
  view = v;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + v));
  $('#title').textContent = titles[v];
  $('#fab').style.display = (v === 'mix' || v === 'moto') ? 'none' : '';
  render();
  window.scrollTo(0, 0);
}

/* ---------- Magazzino ---------- */
let lowOnly = false;
/* Come dividere: tutti insieme, per categoria o per moto */
function modeChips(el, key, after, extraLow){
  const modes = [{id:'all', label:'Tutti insieme'}, {id:'cat', label:'Per categoria'}, {id:'moto', label:'Per moto'}];
  el.innerHTML = modes.map(m => `<button class="chip ${S[key]===m.id?'on':''}" data-md="${m.id}">${m.label}</button>`).join('')
    + (extraLow ? `<button class="chip ${lowOnly?'on':''}" data-low>In esaurimento</button>` : '');
  el.querySelectorAll('[data-md]').forEach(b => b.onclick = () => { S[key] = b.dataset.md; save(); after(); });
  const l = el.querySelector('[data-low]'); if (l) l.onclick = () => { lowOnly = !lowOnly; after(); };
}
/* Raggruppa una lista: restituisce [{title, list}] */
function groupBy(list, mode, catsList, motoOf){
  const byName = (a, b) => a.name.localeCompare(b.name);
  if (mode === 'all') return list.length ? [{title:'', list:[...list].sort(byName)}] : [];
  if (mode === 'cat') return catsList.map(c => ({title:c.label, list:list.filter(x => x.cat === c.id).sort(byName)})).filter(g => g.list.length);
  const motos = S.mf === 'tutte' ? S.motos : S.motos.filter(m => m.id === S.mf);
  const groups = motos.map(m => ({title:motoName(m), list:list.filter(x => motoOf(x, m)).sort(byName)}));
  const used = new Set(groups.flatMap(g => g.list));
  groups.push({title:'Per tutte le moto / altro', list:list.filter(x => !used.has(x)).sort(byName)});
  return groups.filter(g => g.list.length);
}
function itemCard(it){
  const cls = +it.qty <= 0 ? 'zero' : isLow(it) ? 'low' : '';
  const steps = it.unit === 'L' ? [-1, -0.25, 0.25, 1] : [-1, 1];
  const ord = S.orders.filter(o => o.itemId === it.id).reduce((n, o) => n + +o.qty, 0);
  const meta = [S.smode !== 'cat' && it.cat !== 'olio' && catLabel(it.cat), compat(it), it.code, it.loc && '📍 ' + it.loc, it.note, ord && `🚚 ordinati ${fmt(ord, it.unit)}`].filter(Boolean).join(' · ');
  const bar = +it.barMax > 0 ? `<div class="bar"><i style="width:${Math.min(100, it.qty / it.barMax * 100)}%"></i></div>
    <div class="barlbl"><span>0</span><span>${fmt(it.barMax, it.unit)}</span></div>` : '';
  return `<div class="card ${cls}" data-id="${it.id}">
    <div class="row" data-open>
      <div class="grow"><div class="name">${esc(it.name)}</div><div class="meta">${esc(meta) || 'Per tutte le moto'}</div></div>
      <div class="qty">${fmtN(it.qty)} <small>${it.unit === 'L' ? 'L' : 'pz'}</small></div>
    </div>
    ${bar}
    <div class="steps ${steps.length > 2 ? 'four' : ''}">
      ${steps.map(s => `<button data-d="${s}">${s < 0 ? '−' : '+'} ${it.unit === 'L' ? fmt(Math.abs(s), 'L') : Math.abs(s)}</button>`).join('')}
    </div>
  </div>`;
}
function renderStock(){
  modeChips($('#cats'), 'smode', renderStock, true);
  renderMotoFilter($('#motoF'), renderStock);
  const q = $('#q').value.trim().toLowerCase();
  const list = S.items.filter(it => {
    if (!motoMatch(it)) return false;
    if (lowOnly && !isLow(it)) return false;
    if (q && !(it.name + ' ' + it.code + ' ' + it.loc + ' ' + it.note + ' ' + it.model + ' ' + catLabel(it.cat)).toLowerCase().includes(q)) return false;
    return true;
  });
  const low = S.items.filter(isLow).length;
  $('#subtitle').textContent = `${S.items.length} articoli` + (low ? ` · ${low} da ricomprare` : '');
  if (!list.length){ $('#stock').innerHTML = `<div class="empty">Niente qui.<br>Tocca + per aggiungere.</div>`; return; }
  const oils = list.filter(it => it.cat === 'olio').sort((a, b) => a.name.localeCompare(b.name));
  const parts = list.filter(it => it.cat !== 'olio');
  let html = oils.length ? `<h2>Olio e liquidi · per tutte le moto</h2>` + oils.map(itemCard).join('') : '';
  groupBy(parts, S.smode, PCATS, (it, m) => it.model && fits(it, m)).forEach(g => {
    html += `<h2>${esc(g.title || 'Ricambi')}</h2>` + g.list.map(itemCard).join('');
  });
  $('#stock').innerHTML = html;
  $('#stock').querySelectorAll('.card').forEach(card => {
    const it = S.items.find(i => i.id === card.dataset.id);
    card.querySelector('[data-open]').onclick = () => itemSheet(it);
    card.querySelectorAll('[data-d]').forEach(b => b.onclick = () => adjust(it, +b.dataset.d));
  });
}
$('#q').oninput = renderStock;

function adjust(it, d){
  const before = isLow(it);
  it.qty = Math.max(0, r2(+it.qty + d));
  save(); renderStock();
  if (!before && isLow(it)) toast(`${it.name} aggiunto alla spesa`);
}

      <div><label>All'anno</label><input id="f-y2" type="number" inputmode="numeric" value="${esc(it.yTo)}" placeholder="2025"></div>
    </div>${modelList()}
    <div class="note">Lascia vuoto il modello se va bene per tutte le moto. Puoi scrivere anche solo "SX".</div>

      <div><label>Avvisami quando ne ho meno di</label><input id="f-min" type="number" inputmode="decimal" step="any" value="${it.min}"></div>
      <div><label>Quanto ne compro ogni volta</label><input id="f-buy" type="number" inputmode="decimal" step="any" value="${it.buy ?? 1}"></div>
    </div>
    <label>Barra piena a (0 = niente barra)</label><input id="f-bar" type="number" inputmode="decimal" step="any" value="${it.barMax || 0}" placeholder="es. 10">

const autoShop = () => S.items.filter(it => isLow(it) && !isOrdered(it));

  const n = autoShop().length + S.shop.filter(s => !s.done).length;
  const b = $('#shopBadge'); b.hidden = !n; b.textContent = n;
  const d = dueCount(), mb = $('#motoBadge'); mb.hidden = !d; mb.textContent = d;

function addOrder(o){ S.orders.push({id:uid(), date:new Date().toISOString().slice(0,10), ...o}); }
function renderShop(){
  renderMotoFilter($('#motoF2'), renderShop);
  const auto = autoShop().filter(motoMatch), manual = S.shop;
  const n = auto.length + manual.filter(s => !s.done).length;
  $('#subtitle').textContent = (n === 1 ? '1 cosa da prendere' : n + ' cose da prendere') + (S.orders.length ? ` · ${S.orders.length} in arrivo` : '');
  let html = '';
  if (auto.length){
    html += `<h2>Sotto scorta</h2>`;
    auto.forEach(it => {
      html += `<div class="card" data-auto="${it.id}">
        <div class="name">${esc(it.name)}</div>
        <div class="meta">Hai ${fmt(it.qty, it.unit)} · avviso sotto ${fmt(it.min, it.unit)}${compat(it) ? ' · ' + esc(compat(it)) : ''}</div>

    html += `<div class="card ${s.done?'done':''}" data-s="${s.id}"><div class="row">
      <div class="check" data-ck></div>
      <div class="grow" data-ck><div class="name">${esc(s.name)}</div>${s.qty ? `<div class="meta">${esc(s.qty)}</div>` : ''}</div>
      ${s.done ? '' : '<button data-ord>🚚</button>'}
      <button class="danger" data-x aria-label="Rimuovi">✕</button></div></div>`;
  });
  if (manual.some(s => s.done)) html += `<button class="ghost" id="clearDone">Togli quelli spuntati</button>`;

  html += `<h2>Ordinati · in arrivo</h2>`;
  if (!S.orders.length) html += `<div class="meta" style="padding:0 4px 10px">Niente in arrivo.</div>`;
  [...S.orders].sort((a, b) => String(a.date).localeCompare(String(b.date))).forEach(o => {
    const it = S.items.find(i => i.id === o.itemId);
    const days = Math.max(0, Math.round((Date.now() - new Date(o.date)) / 864e5));
    html += `<div class="card" data-o="${o.id}"><div class="row">
      <div class="grow"><div class="name">${esc(it ? it.name : o.name)}</div>
      <div class="meta">${o.qty ? esc(it ? fmt(o.qty, it.unit) : o.qty) + ' · ' : ''}ordinato il ${fmtD(o.date)}${days ? ` (${days} gg fa)` : ''}</div></div>
      <button class="danger" data-x aria-label="Annulla">✕</button>
      <button class="acc" data-arr>Arrivato</button></div></div>`;
  });
  $('#shop').innerHTML = html;

  $('#shop').querySelectorAll('[data-auto]').forEach(c => {
    const it = S.items.find(i => i.id === c.dataset.auto);
    const q = () => { const v = parseFloat(String(c.querySelector('[data-q]').value).replace(',', '.')) || 0; if (v <= 0) c.querySelector('[data-q]').focus(); return v; };
    c.querySelector('[data-took]').onclick = () => { const v = q(); if (!v) return; it.qty = r2(+it.qty + v); save(); renderShop(); toast(`+${fmt(v, it.unit)} in magazzino`); };
    c.querySelector('[data-ord]').onclick = () => { const v = q(); if (!v) return; addOrder({itemId:it.id, qty:v}); save(); renderShop(); toast('Spostato negli ordinati'); };
  });
  $('#shop').querySelectorAll('[data-s]').forEach(c => {
    const s = S.shop.find(x => x.id === c.dataset.s);
    c.querySelectorAll('[data-ck]').forEach(e => e.onclick = () => { s.done = !s.done; save(); renderShop(); });
    const ob = c.querySelector('[data-ord]');
    if (ob) ob.onclick = () => { addOrder({itemId:'', name:s.name, qty:s.qty}); S.shop = S.shop.filter(x => x !== s); save(); renderShop(); toast('Spostato negli ordinati'); };
    c.querySelector('[data-x]').onclick = () => { S.shop = S.shop.filter(x => x !== s); save(); renderShop(); };
  });
  $('#shop').querySelectorAll('[data-o]').forEach(c => {
    const o = S.orders.find(x => x.id === c.dataset.o);
    c.querySelector('[data-x]').onclick = () => { if (confirm('Annullare questo ordine? Torna nella lista della spesa se serve.')){ S.orders = S.orders.filter(x => x !== o); save(); renderShop(); } };
    c.querySelector('[data-arr]').onclick = () => arrivedSheet(o);
  });
  const cd = $('#clearDone'); if (cd) cd.onclick = () => { S.shop = S.shop.filter(s => !s.done); save(); renderShop(); };
}
function arrivedSheet(o){
  const it = S.items.find(i => i.id === o.itemId);
  if (!it){
    // cosa scritta a mano: la togli dagli ordini e, se vuoi, la crei in magazzino
    S.orders = S.orders.filter(x => x !== o); save(); renderShop();
    if (confirm(`"${o.name}" è arrivato. Vuoi aggiungerlo al magazzino?`)) itemSheet(null, {name:o.name, qty:parseFloat(String(o.qty).replace(',', '.')) || 1});
    return;
  }
  openSheet(`<h3>Arrivato: ${esc(it.name)}</h3><div class="meta">Ordinato il ${fmtD(o.date)}</div>
    <label>Quanti ne sono arrivati (${it.unit === 'L' ? 'litri' : 'pezzi'})</label>
    <input id="a-q" type="number" inputmode="decimal" step="any" value="${o.qty}">
    <div class="actions"><button class="acc" id="a-ok">Aggiungi al magazzino</button></div>`);
  $('#a-ok').onclick = () => {
    const q = num('#a-q') ?? 0;
    it.qty = r2(+it.qty + q); S.orders = S.orders.filter(x => x !== o);
    save(); closeSheet(); renderShop(); toast(`+${fmt(q, it.unit)} in magazzino`);
  };
}

    <label>Cosa</label><input id="s-n" placeholder="es. Pastiglie freno anteriori">
    <label>Quantità / note</label><input id="s-q" placeholder="es. 2 pz, marca…">

/* ---------- Moto ---------- */
const dueIn = (m, t) => +t.every > 0 ? Math.round(((+t.lastH || 0) + +t.every - (+m.hours || 0)) * 10) / 10 : null;
const dueCount = () => S.motos.reduce((n, m) => n + (m.maint || []).filter(t => { const d = dueIn(m, t); return d !== null && d <= 0; }).length, 0);
const oilOptions = (m, sel) => `<option value="">Nessuno</option>` + S.items.filter(i => i.unit === 'L' && fits(i, m))
  .map(o => `<option value="${o.id}" ${o.id === sel ? 'selected' : ''}>${esc(o.name)} (hai ${fmt(o.qty, 'L')})</option>`).join('');
const fmtD = d => { try { return new Date(d).toLocaleDateString('it-IT'); } catch(e){ return d; } };

function logGroups(m){
  const g = {};
  m.log.forEach(l => { const k = l.what.trim().toLowerCase(); (g[k] ||= {name:l.what.trim(), list:[]}).list.push(l); });
  return Object.values(g).map(x => { x.list.sort((a, b) => String(b.date).localeCompare(String(a.date))); return x; })
    .sort((a, b) => String(b.list[0].date).localeCompare(String(a.list[0].date)));
}

function renderMoto(){
  const dc = dueCount();
  $('#subtitle').textContent = S.motos.length + ' moto' + (dc ? ` · ${dc} ${dc === 1 ? 'lavoro scaduto' : 'lavori scaduti'}` : '');
  if (!S.motos.length){ $('#moto').innerHTML = `<div class="empty">Nessuna moto. Tocca "Aggiungi moto".</div>`; return; }
  $('#moto').innerHTML = S.motos.map(m => {
    const nItems = S.items.filter(i => i.model && fits(i, m)).length;
    const maint = [...(m.maint || [])].sort((a, b) => (dueIn(m, a) ?? 1e9) - (dueIn(m, b) ?? 1e9));
    const groups = logGroups(m);
    return `<div class="card" data-m="${m.id}">
      <div class="row"><div class="grow"><div class="name" style="font-size:19px">${esc([m.brand, m.model].filter(Boolean).join(' '))}</div>
      <div class="meta">${esc([m.year, m.note].filter(Boolean).join(' · '))}</div></div>
      <div class="qty">${(+m.hours || 0).toLocaleString('it-IT')} <small>ore</small></div></div>
      <div class="steps"><button data-h>Aggiorna ore</button><button data-v class="acc">Pezzi e oli (${nItems})</button></div>

      <h2 style="margin-top:20px">Manutenzione</h2>
      ${maint.length ? maint.map(t => {
        const d = dueIn(m, t), oil = S.items.find(i => i.id === t.oil);
        const st = d === null ? '' : d <= 0 ? 'zero' : d <= Math.max(1, t.every * 0.2) ? 'low' : '';
        const when = d === null ? 'quando serve' : d <= 0 ? `scaduto da ${fmtH(-d)}` : `fra ${fmtH(d)}`;
        return `<div class="mt ${st}" data-t="${t.id}">
          <div class="grow" data-te><div class="name">${esc(t.what)}</div>
          <div class="meta">${t.every > 0 ? 'ogni ' + fmtH(t.every) + ' · ' : ''}<b class="due">${when}</b>${oil && t.liters > 0 ? ' · ' + fmt(t.liters, 'L') + ' ' + esc(oil.name) : ''}</div></div>
          <button data-td>Fatto</button></div>`;
      }).join('') : '<div class="meta">Nessuna voce. Aggiungi la tua tabella di manutenzione.</div>'}
      <button class="ghost" data-ta style="margin-top:6px">+ Aggiungi voce di manutenzione</button>

      <h2 style="margin-top:20px">Storico lavori</h2>
      ${groups.length ? groups.map(g => `<details class="grp">
        <summary><b>${esc(g.name)}</b><span>${g.list.length}× · ultimo ${fmtD(g.list[0].date)}${g.list[0].hours !== '' && g.list[0].hours != null ? ' a ' + fmtH(+g.list[0].hours) : ''}</span></summary>
        ${g.list.map(l => `<div class="lg" data-li="${l.id}"><span>${fmtD(l.date)}</span><span>${l.hours !== '' && l.hours != null ? fmtH(+l.hours) : ''} ✕</span></div>`).join('')}
      </details>`).join('') : '<div class="meta">Ancora nessun lavoro registrato.</div>'}
      <button class="ghost" data-l style="margin-top:6px">+ Registra un altro lavoro</button>

      <h2 style="margin-top:20px">Oli e specifiche</h2>
      ${m.specs.length ? m.specs.map(s => `<div class="spec"><span>${esc(s[0])}</span><span>${esc(s[1])}</span></div>`).join('') : '<div class="meta">Nessuna specifica.</div>'}
      <button class="ghost" data-e style="margin-top:6px">Modifica moto e specifiche</button>
    </div>`;
  }).join('');
  $('#moto').querySelectorAll('[data-m]').forEach(c => {
    const m = S.motos.find(x => x.id === c.dataset.m);
    c.querySelector('[data-h]').onclick = () => hoursSheet(m);
    c.querySelector('[data-v]').onclick = () => { S.mf = m.id; lowOnly = false; save(); go('stock'); };
    c.querySelector('[data-l]').onclick = () => logSheet(m);
    c.querySelector('[data-e]').onclick = () => motoSheet(m);
    c.querySelector('[data-ta]').onclick = () => taskSheet(m);
    c.querySelectorAll('[data-t]').forEach(r => {
      const t = m.maint.find(x => x.id === r.dataset.t);
      r.querySelector('[data-te]').onclick = () => taskSheet(m, t);
      r.querySelector('[data-td]').onclick = () => doneSheet(m, t);
    });
    c.querySelectorAll('[data-li]').forEach(r => r.onclick = () => {
      if (confirm('Eliminare questo lavoro dallo storico?')){ m.log = m.log.filter(l => l.id !== r.dataset.li); save(); renderMoto(); }
    });
  });
}
function hoursSheet(m){
  openSheet(`<h3>Ore motore</h3><label>${esc(motoName(m))}</label>
    <input id="h-v" type="number" inputmode="decimal" step="0.1" value="${m.hours || 0}">
    <div class="actions"><button class="acc" id="h-ok">Salva</button></div>`);
  $('#h-ok').onclick = () => { m.hours = num('#h-v') ?? 0; save(); closeSheet(); renderMoto(); };
}
function taskSheet(m, t){
  const isNew = !t;
  t = t || {id:uid(), what:'', every:0, lastH:+m.hours || 0, oil:'', liters:0};
  openSheet(`<h3>${isNew ? 'Nuova voce' : 'Modifica voce'}</h3>
    <label>Lavoro</label><input id="t-w" list="t-sug" value="${esc(t.what)}" placeholder="es. Cambio olio cambio">
    <datalist id="t-sug"><option>Cambio olio cambio</option><option>Pistone</option><option>Pulizia filtro aria</option><option>Candela</option><option>Catena e corona</option><option>Liquido freni</option><option>Olio forcella</option><option>Olio mono</option><option>Liquido refrigerante</option></datalist>
    <div class="grid2">
      <div><label>Ogni quante ore</label><input id="t-e" type="number" inputmode="decimal" step="0.5" value="${t.every || ''}" placeholder="0 = quando serve"></div>
      <div><label>Fatto l'ultima volta a</label><input id="t-l" type="number" inputmode="decimal" step="0.1" value="${t.lastH ?? ''}" placeholder="ore"></div>
    </div>
    <label>Olio / liquido che usa</label><select id="t-o">${oilOptions(m, t.oil)}</select>
    <label>Litri per ogni intervento</label><input id="t-q" type="number" inputmode="decimal" step="0.05" value="${t.liters || ''}" placeholder="es. 0,8">
    <div class="note">Quando premi "Fatto" scala questi litri dal magazzino e riparte il conto delle ore.</div>
    <div class="actions">${isNew ? '' : '<button class="danger" id="t-del">Elimina</button>'}<button class="acc" id="t-ok">Salva</button></div>`);
  $('#t-ok').onclick = () => {
    const w = $('#t-w').value.trim(); if (!w){ $('#t-w').focus(); return; }
    Object.assign(t, {what:w, every:Math.max(0, num('#t-e') ?? 0), lastH:num('#t-l') ?? 0, oil:$('#t-o').value, liters:Math.max(0, num('#t-q') ?? 0)});
    if (isNew) m.maint.push(t);
    save(); closeSheet(); renderMoto(); toast('Salvato');
  };
  if (!isNew) $('#t-del').onclick = () => {
    if (!confirm(`Togliere "${t.what}" dalla manutenzione?`)) return;
    m.maint = m.maint.filter(x => x !== t); save(); closeSheet(); renderMoto();
  };
}
function useOil(sel, qsel){
  const o = S.items.find(i => i.id === $(sel).value), q = num(qsel);
  if (o && q > 0){ o.qty = Math.max(0, r2(o.qty - q)); return `scalati ${fmt(q, 'L')}`; }
  return '';
}
function doneSheet(m, t){
  openSheet(`<h3>${esc(t.what)}</h3><div class="meta">${esc(motoName(m))}</div>
    <div class="grid2">
      <div><label>Data</label><input id="d-d" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div><label>Ore motore</label><input id="d-h" type="number" inputmode="decimal" step="0.1" value="${m.hours || 0}"></div>
    </div>
    <label>Olio / liquido usato</label><select id="d-o">${oilOptions(m, t.oil)}</select>
    <label>Litri usati</label><input id="d-q" type="number" inputmode="decimal" step="0.05" value="${t.liters || ''}">
    <div class="actions"><button class="acc" id="d-ok">Segna come fatto</button></div>`);
  $('#d-ok').onclick = () => {
    const h = num('#d-h') ?? (+m.hours || 0);
    t.lastH = h; if (h > (+m.hours || 0)) m.hours = h;
    m.log.unshift({id:uid(), date:$('#d-d').value || new Date().toISOString().slice(0,10), hours:h, what:t.what});
    const msg = useOil('#d-o', '#d-q');
    save(); closeSheet(); renderMoto(); toast('Fatto' + (msg ? ' · ' + msg : ''));
  };
}
function logSheet(m){
  const names = [...new Set([...(m.maint || []).map(t => t.what), ...m.log.map(l => l.what)])];
  openSheet(`<h3>Registra lavoro</h3>
    <label>Cosa hai fatto</label><input id="l-w" list="l-sug" placeholder="es. Cambio leve">
    <datalist id="l-sug">${names.map(n => `<option>${esc(n)}</option>`).join('')}</datalist>
    <div class="note" style="margin-top:6px">Usa lo stesso nome per raggrupparlo con i lavori uguali.</div>
    <div class="grid2">
      <div><label>Data</label><input id="l-d" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div><label>Ore motore</label><input id="l-h" type="number" inputmode="decimal" step="0.1" value="${m.hours || ''}"></div>
    </div>
    <label>Hai usato liquidi? (scala dal magazzino)</label><select id="l-o">${oilOptions(m, '')}</select>
    <label>Litri usati</label><input id="l-q" type="number" inputmode="decimal" step="0.05" placeholder="es. 0,25">
    <div class="actions"><button class="acc" id="l-ok">Salva</button></div>`);
  $('#l-ok').onclick = () => {
    const what = $('#l-w').value.trim(); if (!what){ $('#l-w').focus(); return; }
    const h = num('#l-h');
    m.log.unshift({id:uid(), date:$('#l-d').value || new Date().toISOString().slice(0,10), hours:h ?? '', what});
    if (h !== null && h > (m.hours || 0)) m.hours = h;
    const t = (m.maint || []).find(x => x.what.trim().toLowerCase() === what.toLowerCase());
    if (t && h !== null) t.lastH = h;
    const msg = useOil('#l-o', '#l-q');
    save(); closeSheet(); renderMoto(); toast('Registrato' + (msg ? ' · ' + msg : ''));
  };
}
function motoSheet(m){
  const isNew = !m;
  m = m || {id:uid(), brand:'', model:'', year:'', note:'', hours:0, specs:[], log:[], maint:[]};
  openSheet(`<h3>${isNew ? 'Nuova moto' : 'Modifica moto'}</h3>
    <div class="grid3">
      <div><label>Marca</label><input id="m-b" value="${esc(m.brand)}" placeholder="KTM"></div>
      <div><label>Modello</label><input id="m-m" value="${esc(m.model)}" placeholder="SX 125"></div>
      <div><label>Anno</label><input id="m-y" type="number" inputmode="numeric" value="${esc(m.year)}" placeholder="2025"></div>
    </div>
    <div class="grid2">
      <div><label>Note</label><input id="m-note" value="${esc(m.note)}" placeholder="es. Supermoto"></div>
      <div><label>Ore motore</label><input id="m-h" type="number" inputmode="decimal" step="0.1" value="${m.hours || 0}"></div>
    </div>
    <label>Oli e specifiche (una per riga: voce = valore)</label>
    <textarea id="m-s" rows="7" placeholder="Olio cambio = 0,8 L 15W-50&#10;Miscela = 1:40&#10;Freni = DOT 4">${esc(m.specs.map(s => s[0] + ' = ' + s[1]).join('\n'))}</textarea>
    <div class="actions">${isNew ? '' : '<button class="danger" id="m-del">Elimina</button>'}<button class="acc" id="m-ok">Salva</button></div>`);
  $('#m-ok').onclick = () => {
    const b = $('#m-b').value.trim(), mo = $('#m-m').value.trim();
    if (!b && !mo){ $('#m-b').focus(); return; }
    Object.assign(m, {brand:b, model:mo, year:$('#m-y').value.trim(), note:$('#m-note').value.trim(), hours:num('#m-h') ?? 0});
    m.specs = $('#m-s').value.split('\n').map(l => l.split('=')).filter(p => p[0].trim()).map(p => [p[0].trim(), p.slice(1).join('=').trim()]);
    if (isNew) S.motos.push(m);
    save(); closeSheet(); renderMoto(); toast(isNew ? 'Moto aggiunta' : 'Salvato');
  };
  if (!isNew) $('#m-del').onclick = () => {
    if (!confirm(`Eliminare ${motoName(m)}? I ricambi restano in magazzino.`)) return;
    S.motos = S.motos.filter(x => x !== m);
    if (S.mf === m.id) S.mf = 'tutte';
    save(); closeSheet(); renderMoto();
  };
}
$('#addMoto').onclick = () => motoSheet();

/* ---------- Miscela ---------- */
const mixOil = () => S.items.find(i => i.use === 'mix') || S.items.find(i => /2t|miscela/i.test(i.name));
function renderMix(){
  $('#subtitle').textContent = 'Calcolo olio per la benzina';
  $('#mixL').value = S.mixL ? r2(S.mixL) : '';
  $('#mixAdd').innerHTML = [0.1, 0.5, 1, 2, 5, 10].map(l => `<button data-a="${l}">+ ${fmtN(l)} L</button>`).join('');
  $('#mixAdd').querySelectorAll('button').forEach(b => b.onclick = () => { S.mixL = r2((+S.mixL || 0) + +b.dataset.a); save(); $('#mixL').value = r2(S.mixL); calcMix(); });
  $('#mixRatio').innerHTML = [32, 40, 50, 60].map(r => `<button class="chip ${S.mixRatio==r?'on':''}" data-r="${r}">1:${r}</button>`).join('');
  $('#mixRatio').querySelectorAll('.chip').forEach(b => b.onclick = () => { S.mixRatio = +b.dataset.r; save(); renderMix(); });
  $('#lastBackup').textContent = S.lastBackup ? 'Ultimo backup: ' + fmtD(S.lastBackup) : 'Nessun backup ancora.';
  calcMix();
}
function calcMix(){
  const L = +S.mixL || 0;
  const ml = Math.round(L * 1000 / S.mixRatio);
  $('#mixOut').textContent = ml + ' ml';
  const o = mixOil();
  $('#mixNote').textContent = o ? `Hai ${fmt(o.qty, 'L')} di ${o.name}.` : 'Aggiungi un olio 2T in magazzino per scalarlo in automatico.';
  return ml;
}
$('#mixL').oninput = () => { S.mixL = Math.max(0, num('#mixL') ?? 0); save(); calcMix(); };
$('#mixZero').onclick = () => { S.mixL = 0; save(); $('#mixL').value = ''; calcMix(); };
$('#mixUse').onclick = () => {
  const ml = calcMix(), o = mixOil();
  if (!ml){ toast('Prima metti i litri di benzina'); return; }
  if (!o){ toast('Nessun olio 2T in magazzino'); return; }
  o.qty = Math.max(0, Math.round((o.qty - ml / 1000) * 1000) / 1000);
  S.mixL = 0; save(); $('#mixL').value = ''; calcMix();
  toast(`Scalati ${ml} ml di olio 2T`);
};

/* ---------- Backup ---------- */
$('#exp').onclick = async () => {
  S.lastBackup = new Date().toISOString(); save();
  const name = `box-backup-${new Date().toISOString().slice(0,10)}.json`;
  const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
  try {
    const file = new File([blob], name, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Backup Box'}); renderMix(); return; }
  } catch(e){ if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000); renderMix();
};
$('#imp').onclick = () => $('#impFile').click();
$('#impFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d.items || !d.motos) throw 0;
    if (!confirm('Sostituire tutti i dati attuali con quelli del backup?')) return;
    S = d; migrate(); save(); render(); toast('Backup importato');
  } catch(err){ toast('File non valido'); }
  e.target.value = '';
};

/* ---------- Sheet ---------- */
function openSheet(html){ $('#sheetBody').innerHTML = html; $('#sheet').scrollTop = 0; $('#sheet').classList.add('on'); $('#sheetBg').classList.add('on'); }
function closeSheet(){ $('#sheet').classList.remove('on'); $('#sheetBg').classList.remove('on'); document.activeElement && document.activeElement.blur(); }
$('#sheetBg').onclick = closeSheet;

$('#fab').onclick = () => ({stock:() => itemSheet(), shop:shopSheet, old:() => oldSheet()})[view]?.();

/* ---------- Render ---------- */
function render(){ ({stock:renderStock, shop:renderShop, old:renderOld, moto:renderMoto, mix:renderMix})[view](); renderBadge(); }
function net(){ const on = navigator.onLine; $('#dot').style.background = on ? 'var(--ok)' : 'var(--warn)'; $('#net').textContent = on ? 'online' : 'offline'; }
addEventListener('online', net); addEventListener('offline', net); net();
save(); render();

/* ---------- Offline ---------- */
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
